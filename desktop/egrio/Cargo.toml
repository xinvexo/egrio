[package]
name = "egrio"
version.workspace = true
description = "The Egrio desktop app: its entry point and the platform backends"
edition.workspace = true
license-file.workspace = true

[features]
# A local control socket for system tests; never in a release package.
test-control = ["dep:objc2-core-graphics", "dep:png"]

[dependencies]
egrio-daemon = { workspace = true }
egrio-desktop = { workspace = true }
egrio-ui = { workspace = true }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-core-graphics = { version = "0.3.2", optional = true }
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMediaTimingFunction"] }
objc2-uniform-type-identifiers = "0.3.2"

# GTK 4 and libadwaita, held to the APIs Ubuntu 24.04 ships (GTK 4.14,
# libadwaita 1.5); the tray is a StatusNotifierItem on the session bus.
[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
ksni = "0.3.7"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync"] }

# WinUI 3 through bindings windows-bindgen generates from the Windows App SDK
# metadata (`cargo xtask windows-deps --bindings`).
[target.'cfg(windows)'.dependencies]
# The test control channel's screenshots; never in a release package.
png = { version = "0.18", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows-collections = "0.100.0"
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-reference = { version = "0.100.0", features = ["std"] }
windows-time = "0.100.0"
