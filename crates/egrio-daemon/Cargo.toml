[package]
name = "egrio-daemon"
version.workspace = true
edition.workspace = true
description = "Non-GUI runtime composition for Egrio"
license.workspace = true
license-file.workspace = true

[dependencies]
egrio-core = { workspace = true }
# Shared platform contracts are capture-agnostic, so this stays a normal
# dependency the server build also links.
egrio-platform = { workspace = true }
# The concrete OS capture adapters are optional and gated behind `capture`:
# the server build (`--no-default-features --features server`)
# links none of them, so a server binary carries no platform-capture code.
egrio-platform-linux = { workspace = true, optional = true }
egrio-platform-macos = { workspace = true, optional = true }
egrio-platform-windows = { workspace = true, optional = true }
egrio-runtime = { workspace = true, optional = true }
egrio-sdk = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true }

[features]
default = ["capture"]
# The OS capture host: pulls the concrete platform adapters and compiles the
# capture facade (apply/restore, privileged service, service IPC, platform
# dispatch). The desktop host and the service CLI enable it; the server build
# does not.
capture = [
    "dep:egrio-runtime",
    "dep:egrio-sdk",
    "dep:egrio-platform-linux",
    "dep:egrio-platform-macos",
    "dep:egrio-platform-windows",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-service-management",
]
# The server-assembly role: no platform capture, and enables the core
# `server` feature that gates server-only concerns (certificate loading and
# the encrypted server acceptors).
server = ["egrio-core/server"]

[dev-dependencies]
# Generates a throwaway self-signed cert (with PEM output) so the server gate
# can stand up a real Hysteria2 QUIC/TLS endpoint; ring backend to match the
# core's TLS provider.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[[bin]]
name = "egrio-server"
path = "src/bin/egrio-server.rs"
required-features = ["server"]

[[bin]]
name = "egrio-node"
path = "src/bin/egrio-node.rs"
required-features = ["capture", "server"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# SMAppService for the macOS service registration (capture only).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"], optional = true }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
