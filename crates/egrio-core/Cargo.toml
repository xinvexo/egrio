[package]
name = "egrio-core"
version.workspace = true
edition.workspace = true
description = "Reusable native proxy core for Egrio"
license-file.workspace = true

[dependencies]
# A rule set's keywords in one automaton; the library `regex` already links.
aho-corasick = "1.1"
arc-swap = { workspace = true }
# AES-CTR, HMAC and AEAD for OpenVPN's tls-crypt and data channel; the
# library rustls and quinn already link.
aws-lc-rs = "1.18"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
# HashTable: rule-set domain indexes keyed into a shared text block.
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
http = "1"
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# What a host's log should hear of: the rules a Core goes live without.
log = "0.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-proto = { version = "0.11.19", default-features = false }
rand = "0.9"
regex = { workspace = true }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-pki-types = "1"
# PEM loader for the server-role certificate subsystem; optional so
# a client build, which never accepts an encrypted inbound, does not link it.
# Pulled in by the `server` feature below.
rustls-pemfile = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = "0.6"
# SHA-224 for the Trojan password hash: both halves
# derive `hex(SHA224(password))`, so it links in every build, not just `server`.
sha2 = "0.10"
# Only the SS2022 wire codec is used; Egrio owns all sockets, DNS and routing.
shadowsocks = { version = "1.25.0", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
shadowsocks-crypto = "0.8.0"
time = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# TCP-plus-TLS for the Trojan hop: the client connector
# originates TLS in every build; the server acceptor terminates it behind the
# `server` feature. default-features off pins the aws-lc-rs provider the rest
# of the crate's TLS uses (see `tls.rs`) and its TLS-1.3-only rustls, like
# `certificate.rs`.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-util = { workspace = true, features = ["rt"] }
webpki-roots = "1"

[features]
# Bench-only wrappers exposing crate-internal hot paths to the criterion
# benches (see bench/README.md). Never enabled in shipping builds.
bench-internals = []
# Server-assembly role: the boundary the server host enables and a client
# build does not, gating the server-only concerns a client must not carry:
# the certificate-loading subsystem and the encrypted server acceptors.
server = ["dep:rustls-pemfile"]
validation-tools = []

# `sysctlbyname`: the TCP receive buffer limits the host sets (egress.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
# examples/support/fd_limit.rs: the load-harness examples raise their own
# fd headroom the way any host process would. examples/support/os_memory.rs
# reads the process's physical footprint on macOS.
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
# Generates a throwaway self-signed cert (with PEM output) so the Hysteria2
# server gate can stand up a real QUIC/TLS endpoint; ring backend to match the
# crate's TLS provider.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The client side of the TCP engine's randomized tests and the packet-path
# examples: an independent TCP implementation playing each app's kernel stack.
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "log"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[example]]
name = "socks5_validation_proxy"
required-features = ["validation-tools"]

[[example]]
name = "hysteria2_fairness"
required-features = ["server"]

[[bench]]
name = "core_hot_paths"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "outbound_hot_paths"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "session_tables"
harness = false
required-features = ["bench-internals"]
