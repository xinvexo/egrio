[package]
name = "egrio-service"
version.workspace = true
edition.workspace = true
description = "Privileged capability adapter service for Egrio (Windows service, Linux helper, macOS launchd service)"
license-file.workspace = true

[lib]
name = "egrio_service"
path = "src/lib.rs"

[[bin]]
name = "egrio-service"
path = "src/bin/egrio-service.rs"

[dependencies]
egrio-core = { workspace = true }
egrio-platform-windows = { workspace = true }
egrio-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
egrio-platform = { workspace = true }
egrio-platform-linux = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
egrio-platform-macos = { workspace = true }
libc = "0.2"
log = "0.4"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading"] }
